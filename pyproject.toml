[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "resolveflow-agent"
version = "0.1.0"
description = "A production-oriented customer support investigation and resolution agent."
requires-python = ">=3.12"
dependencies = [
    "alembic==1.18.5",
    "celery[redis]==5.6.3",
    "fastapi==0.139.0",
    "httpx2>=2.7,<3.0",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.0",
    "mcp==2.0.0",
    "openai==2.46.0",
    "opentelemetry-api==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pgvector==0.5.0",
    "prometheus-client==0.26.0",
    "pyjwt==2.13.0",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.51",
    "tiktoken==0.13.0",
    "uvicorn>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest_tmp"
testpaths = ["tests"]
markers = [
    "postgres: requires a real PostgreSQL database",
]

[tool.setuptools.packages.find]
include = ["app*"]
